name: M1 bounded verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: mypi-bounded-verification
  cancel-in-progress: false
jobs:
  verify:
    name: bounded-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Ordinary PR CI: test the proposed merge, including its lockfile and scripts.
      # No pull_request_target privileges, repository secrets or publisher job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '12.6.0'
          run_install: false
      - name: Provision isolated ephemeral runner
        timeout-minutes: 5
        run: |
          # The runner's Azure apt mirror is sometimes unresolvable; use the Ubuntu archive then.
          if ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            sudo grep -rl 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list /etc/apt/sources.list.d \
              | xargs -r sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#'
            if ! getent hosts archive.ubuntu.com >/dev/null; then
              # The runner's resolver fails for Ubuntu hosts only; resolve the archive over HTTPS.
              ip=$(curl -fsS --max-time 20 -H 'accept: application/dns-json' \
                'https://cloudflare-dns.com/dns-query?name=archive.ubuntu.com&type=A' \
                | jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty')
              test -n "$ip"
              echo "$ip archive.ubuntu.com" | sudo tee -a /etc/hosts >/dev/null
            fi
          fi
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap dbus-user-session
          # Permit namespaces only for bwrap on this disposable VM; keep AppArmor enabled.
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile mypi-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
            | sudo tee /etc/apparmor.d/mypi-bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/mypi-bwrap
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install dependencies from this revision
        timeout-minutes: 5
        run: timeout --kill-after=5s 295s pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Install the pinned Rust toolchain
        timeout-minutes: 5
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' tui/rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - name: Fetch the locked Rust crates of this revision
        timeout-minutes: 5
        run: timeout --kill-after=5s 295s bash scripts/tui.sh fetch
      - name: Build and verify this revision
        run: bash scripts/ci.sh
      - name: Diagnose isolation failure without loosening it
        if: failure()
        run: |
          bwrap --version
          (cd tui && rustc --version) || true
          systemd --version
          uname -r
          grep -H . /proc/self/attr/current
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo journalctl -k --no-pager -n 100 | grep -E 'apparmor|DENIED|bwrap|audit' || true

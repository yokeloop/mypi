name: M1 bounded verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: mypi-bounded-verification
  cancel-in-progress: false
jobs:
  verify:
    name: bounded-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Ordinary PR CI: test the proposed merge, including its lockfile and scripts.
      # No pull_request_target privileges, repository secrets or publisher job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '12.6.0'
          run_install: false
      - name: Provision isolated ephemeral runner
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap dbus-user-session
          # Permit namespaces only for bwrap on this disposable VM; keep AppArmor enabled.
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile mypi-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
            | sudo tee /etc/apparmor.d/mypi-bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/mypi-bwrap
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install dependencies from this revision
        timeout-minutes: 5
        run: timeout --kill-after=5s 295s pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Build and verify this revision
        run: bash scripts/ci.sh
      - name: Diagnose isolation failure without loosening it
        if: failure()
        run: |
          bwrap --version
          systemd --version
          uname -r
          grep -H . /proc/self/attr/current
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo journalctl -k --no-pager -n 100 | grep -E 'apparmor|DENIED|bwrap|audit' || true

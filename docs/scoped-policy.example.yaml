# Inert validation/preview example. This file is not installed or activated.
version: 1
defaults:
  allow: [data.read, filesystem.read, workspace.inspect, policy.validate, policy.explain]
profiles:
  standard:
    isolation: none
  isolated:
    isolation: required
overrides:
  organizations:
    example:
      allow: [data.read, filesystem.read, workspace.inspect, policy.validate, policy.explain]
  projects:
    example/demo:
      allow: [data.read, policy.validate, policy.explain]
repositories:
  example/demo:
    root: /srv/mypi-projects/example/demo

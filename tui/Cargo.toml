[package]
name = "mypi-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Terminal UI over the mypi HTTP API: a Herdr plugin pane or a plain terminal command"

[dependencies]
ratatui = "0.30.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = { version = "3.5.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = false

[profile.release]
strip = true
